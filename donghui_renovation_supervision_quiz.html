<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>東薈城裝修單位監管互動訓練</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#402218,#b65f2a);min-height:100vh;color:#332018}.app{max-width:860px;margin:auto;padding:18px}.panel{background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 35px #30150c77}h1{text-align:center;color:#6b301b;margin:8px 0 5px}.sub{text-align:center;color:#80675d;margin-bottom:25px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff0e5;border-radius:14px;padding:12px 16px;margin-bottom:20px;font-weight:bold}.progress{height:10px;background:#eadbd2;border-radius:10px;overflow:hidden;margin:12px 0 25px}.bar{height:100%;background:#e8873f;width:0;transition:.3s}.question{font-size:1.35rem;font-weight:bold;line-height:1.55;margin:20px 0}.options{display:grid;gap:12px}.option{border:2px solid #d5b9aa;background:#fff;border-radius:13px;padding:15px;text-align:left;font-size:1rem;cursor:pointer}.option:hover{border-color:#b65f2a;background:#fff5ef}.option.correct{background:#d8f3dc;border-color:#2a9d8f}.option.wrong{background:#ffe0e0;border-color:#e76f51}.btn{border:0;border-radius:12px;padding:13px 21px;margin:8px 4px;background:#b65f2a;color:#fff;font-weight:bold;cursor:pointer}.btn:hover{filter:brightness(1.1)}.feedback{margin-top:18px;padding:14px;border-radius:12px;background:#fff4d6;line-height:1.6}.center{text-align:center}.hidden{display:none}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:#fff0e5;padding:18px;text-align:center;border-radius:14px}.stat strong{display:block;font-size:2rem;color:#b65f2a}.type{font-size:.85rem;color:#b65f2a;margin-top:20px;font-weight:bold}.review{padding:12px;border-bottom:1px solid #eadbd2;line-height:1.5}.hint{background:#f8eee8;border-left:4px solid #b65f2a;padding:12px;border-radius:8px;line-height:1.6}@media(max-width:600px){.panel{padding:20px}.question{font-size:1.15rem}.result{grid-template-columns:1fr}.top{font-size:.9rem}}
</style></head><body><div class="app"><div class="panel"><h1>東薈城裝修單位監管</h1><div class="sub">物業管理組第七篇：互動培訓競答</div>
<section id="intro"><div class="hint"><b>測驗內容：</b>工作申請表、張貼裝修／工程守則、承辦商入場及登記、裝修期間巡查、熱作業、氣味及噪音工程、運送廢料或裝修用料。</div><p>本測驗共有 20 條題目，每次會隨機抽取 10 條。題型包括選擇題、是非題及情境題。每題限時 20 秒，答對加 10 分。</p><div class="center"><input id="name" placeholder="輸入姓名或暱稱" style="padding:14px;border:2px solid #d5b9aa;border-radius:10px;width:90%;max-width:360px;font-size:1rem"><br><button class="btn" onclick="start()">開始答題</button></div></section>
<section id="quiz" class="hidden"><div class="top"><span id="who"></span><span>分數：<b id="score">0</b></span><span id="count">1 / 10</span><span>限時：<b id="time">20</b> 秒</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="type" class="type"></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><div class="center"><button id="next" class="btn hidden" onclick="next()">下一題</button></div></section>
<section id="result" class="hidden"><h2 class="center">🎉 測驗完成</h2><div class="result"><div class="stat">總分<strong id="finalScore">0</strong></div><div class="stat">答對<strong id="finalCorrect">0/10</strong></div><div class="stat">準確率<strong id="accuracy">0%</strong></div></div><h2>答案檢討</h2><div id="review"></div><div class="center"><button class="btn" onclick="location.reload()">重新開始</button></div></section></div></div>
<script>
const bank=[
{t:'選擇題',q:'以下哪一項不屬於本篇裝修單位監管的主要內容？',o:['工作申請表','承辦商入場及登記','裝修期間巡查','員工薪酬計算'],a:3,e:'本篇重點包括工作申請、守則、承辦商登記、巡查、熱作業、氣味、噪音及物料運送監管。'},
{t:'選擇題',q:'工作申請表內應清楚列明哪些資料？',o:['單位編號、店名、工程性質及類型','員工私人住址','顧客購物記錄','員工午膳時間'],a:0,e:'工程申請資料應清楚列明單位編號、店名、工程性質、類型及相關還原／打拆等資料。'},
{t:'是非題',q:'裝修單位只要已提交申請表，便不需要張貼裝修工程守則。',o:['正確','錯誤'],a:1,e:'除了工作申請表，亦須張貼裝修／工程守則，讓相關人員清楚遵守要求。'},
{t:'情境題',q:'承辦商第一次到場工作，你首先應確認甚麼？',o:['只確認他是否帶有工具','確認其入場資格、登記及相關工作資料','直接讓他自行進入','只問他預計幾點離開'],a:1,e:'承辦商入場前須按程序核對入場及登記資料，確保工作獲批准。'},
{t:'選擇題',q:'裝修期間同事巡查時，最重要的工作之一是？',o:['只觀察店舖外觀','確認工作是否按申請及守則進行','替承辦商搬運材料','代替承辦商完成工程'],a:1,e:'巡查需核對現場工作是否符合申請內容、時間及裝修／工程守則。'},
{t:'是非題',q:'巡查時發現工程內容與申請表不一致，應記錄並按程序跟進。',o:['正確','錯誤'],a:0,e:'發現不一致或違規情況，應記錄、通知相關負責人並按程序跟進。'},
{t:'情境題',q:'現場準備進行熱作業，但未能確認相關安全措施，你應該怎樣做？',o:['立即批准開始','要求先確認熱作業要求及安全措施','叫承辦商自行決定','只提醒小心便離開'],a:1,e:'熱作業涉及火源及火警風險，開始前須確認批准、工作環境及所需安全措施。'},
{t:'選擇題',q:'以下哪一項最適合用作氣味工程巡查？',o:['只憑感覺判斷','按要求使用氣味／氣體探測儀器檢查異常來源','完全不需巡查','只在收到投訴後才處理'],a:1,e:'資料提及可使用探測儀器勘察是否有剩餘異常氣味來源，並按要求跟進。'},
{t:'是非題',q:'噪音工程只要在租戶單位內進行，便不會影響其他人士，因此不需要監管。',o:['正確','錯誤'],a:1,e:'噪音可能影響公眾及其他租戶，必須按工程時間及守則監管。'},
{t:'情境題',q:'有租戶反映裝修噪音影響營業，你應先做甚麼？',o:['直接責罵承辦商','記錄情況、核對申請及工程時段，並按程序跟進','叫租戶自行離開','不作處理'],a:1,e:'應先記錄、核對批准資料及時段，再通知相關負責人採取適當措施。'},
{t:'選擇題',q:'資料顯示一般裝修工作的指定時段為哪一組？',o:['07:00–10:00','10:00–20:30','20:30–07:00','23:00–06:00'],a:1,e:'投影片列出裝修工作時段為 10:00–20:30；另有資料列出 07:00–10:00 及 20:30–07:00 等時間要求，實際須按申請及守則核對。'},
{t:'選擇題',q:'某些指定裝修工作需要安排在甚麼時段？',o:['只可於辦公時間進行','20:30–07:00 的指定時段','任何時間均可','只可於午餐時間'],a:1,e:'資料列出部分裝修／工程安排涉及 20:30–07:00 時段，必須按照批准及守則執行。'},
{t:'是非題',q:'工程時間及施工時段應以申請表、批准資料及現場守則作核對。',o:['正確','錯誤'],a:0,e:'巡查時應核對申請表及批准工程時段，不能只依靠口頭說法。'},
{t:'情境題',q:'承辦商要運送廢料，最適當的監管方法是？',o:['讓承辦商使用任何通道','核對運送安排、物料性質、路線及時間要求','要求顧客協助搬運','把廢料暫放在逃生通道'],a:1,e:'廢料或裝修用料運送須按指定安排及守則，避免阻塞通道或影響公眾安全。'},
{t:'選擇題',q:'運送廢料或裝修用料的資料應清楚列明甚麼？',o:['物料性質及類型','承辦商喜歡的飲品','員工私人電話清單','商場銷售目標'],a:0,e:'資料強調運送廢料或用料的性質、類型等資料要清楚列明。'},
{t:'情境題',q:'發現廢料暫放在公眾通道，你應該怎樣做？',o:['不理會','即時要求移走／隔離風險並通知相關負責人','拍照後放到翌日','讓顧客自行繞路'],a:1,e:'公眾通道不可被物料阻塞，應即時控制風險並按程序通知及跟進。'},
{t:'是非題',q:'承辦商登記只需第一次進場時進行，之後每次均不需要核對。',o:['正確','錯誤'],a:1,e:'每次入場都應按現行程序核對身份、批准及登記要求，不能假設資料一直有效。'},
{t:'選擇題',q:'裝修／工程守則的主要作用是甚麼？',o:['提供裝飾建議','列明承辦商及租戶須遵守的工程安全及管理要求','取代所有巡查','只作宣傳用途'],a:1,e:'守則是現場管理及監管的重要依據，承辦商及租戶須按要求執行。'},
{t:'情境題',q:'你巡查時發現氣味異常但未能即時找出來源，最適當的做法是？',o:['自行進入危險位置尋找','記錄、通知相關部門，按要求使用儀器及跟進來源','只開門通風後離開','等待顧客投訴'],a:1,e:'未知來源的異常氣味需要按程序處理，必要時使用探測儀器及通知相關部門。'},
{t:'選擇題',q:'PMT、SPA/PA 或 PS/APS 在裝修監管中的共同重點是？',o:['協助按程序申請、張貼守則、登記及巡查跟進','替承辦商進行所有工程','只負責收取租金','不需要記錄違規情況'],a:0,e:'不同崗位需按職責協助申請、守則、入場登記及工程期間巡查與跟進。'}
];
let pool=[],i=0,score=0,correct=0,name='',timer,answered=false,history=[];function $(x){return document.getElementById(x)}
function start(){name=$('name').value.trim()||'匿名員工';pool=[...bank].sort(()=>Math.random()-.5).slice(0,10);$('who').textContent='👤 '+name;$('intro').classList.add('hidden');$('quiz').classList.remove('hidden');render();sound('start')}
function render(){answered=false;let x=pool[i];$('count').textContent=`${i+1} / 10`;$('score').textContent=score;$('type').textContent=x.t;$('question').textContent=x.q;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('bar').style.width=(i/10*100)+'%';let box=$('options');box.innerHTML='';x.o.forEach((v,n)=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>answer(n);box.appendChild(b)});startTimer()}
function startTimer(){clearInterval(timer);let left=20;$('time').textContent=left;timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0){clearInterval(timer);sound('timeout');answer(-1)}},1000)}
function answer(n){if(answered)return;answered=true;clearInterval(timer);let x=pool[i],ok=n===x.a;if(ok){score+=10;correct++;sound('correct')}else sound('wrong');history.push({x,n,ok});document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct');else if(k===n)b.classList.add('wrong')});$('score').textContent=score;$('feedback').innerHTML=(ok?'✅ 答對！':'❌ 答錯／超時。')+'<br>'+x.e;$('feedback').classList.remove('hidden');$('next').textContent=i===9?'查看結果':'下一題';$('next').classList.remove('hidden');$('bar').style.width=((i+1)/10*100)+'%'}
function next(){i++;if(i>=10)finish();else{sound('click');render()}}
function finish(){clearInterval(timer);sound('finish');$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=score;$('finalCorrect').textContent=`${correct}/10`;$('accuracy').textContent=Math.round(correct/10*100)+'%';$('review').innerHTML=history.map((h,n)=>`<div class="review"><b>${n+1}. ${h.ok?'✅':'❌'} ${h.x.q}</b><br>正確答案：${h.x.o[h.x.a]}<br><small>${h.x.e}</small></div>`).join('')}
let audioCtx;function sound(kind){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;let f=kind==='correct'?880:kind==='wrong'?180:kind==='timeout'?120:kind==='finish'?660:440;o.frequency.value=f;o.type=kind==='wrong'||kind==='timeout'?'sawtooth':'sine';g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+(kind==='finish'?0.5:0.16));o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+(kind==='finish'?0.55:0.18));if(kind==='finish'){setTimeout(()=>sound('correct'),180)}}catch(e){}}
</script></body></html>
